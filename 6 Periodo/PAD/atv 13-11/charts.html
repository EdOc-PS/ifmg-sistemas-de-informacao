<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graficos</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>

    <script>
        google.charts.load('current', { packages: ['corechart'] });

        function converterCSVparaArray(texto) {
            const linhas = texto.trim().split("\n");

            let result = [["Item", "Valor", { role: "style" }]];

            linhas.forEach(linha => {
                const partes = linha.split(",");
                const item = partes[0];
                const valor = parseFloat(partes[1]);
                const cor = partes[2] || "red";
                result.push([item, valor, cor]);
            });

            return result;
        }

        function lerCSV(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = function (e) {
                const texto = e.target.result;
                const dataArray = converterCSVparaArray(texto);
                drawChart(dataArray);
            };

            reader.readAsText(file);
        }

        function drawChart(dataArray) {
            const data = google.visualization.arrayToDataTable(dataArray);

            const options = {
                title: "Gráfico",
            };

            const chart = new google.visualization.ColumnChart(
                document.getElementById("chart")
            );

            chart.draw(data, options);
        }
    </script>
</head>

<body>
    <h2>Leitor de CSV</h2>
    <input type="file" accept=".csv" onchange="lerCSV(this)"><br><br>
    <p>Gráfico Google Charts:</p>
    <div id="chart" style="width: 1000px; height: 500px;"></div>
</body>

</html>
